# nginx site for Droolbites on the VPS (host nginx in front of the Docker app).
# Install: see docs/deploy-vps.md. The app listens on 127.0.0.1:3010 (compose.prod.yml).
#
# First time only (no certificate yet): install just the HTTP part of this file
#   sudo sed '/^# ---- HTTPS ----$/,$d' deploy/nginx/droolbites.conf | sudo tee /etc/nginx/sites-available/droolbites.conf
# then run certbot (webroot) and install the whole file.

server {
    listen 80;
    server_name droolbites.biz.id www.droolbites.biz.id;

    # Let's Encrypt HTTP-01 challenges (certbot --webroot -w /var/www/html).
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://droolbites.biz.id$request_uri;
    }
}

# ---- HTTPS ----

server {
    listen 443 ssl http2;
    server_name www.droolbites.biz.id;

    ssl_certificate /etc/letsencrypt/live/droolbites.biz.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/droolbites.biz.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://droolbites.biz.id$request_uri;
}

server {
    listen 443 ssl http2;
    server_name droolbites.biz.id;

    ssl_certificate /etc/letsencrypt/live/droolbites.biz.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/droolbites.biz.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Product photos are up to 8 MB; server actions accept bodies up to 10 MB (next.config.ts).
    client_max_body_size 10m;

    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The app (TRUST_PROXY=1) uses the LAST X-Forwarded-For entry, the one nginx appends.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
